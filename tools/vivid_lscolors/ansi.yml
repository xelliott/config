colors:
  # background_color: 'f6f2ee'
  white: ansi:white
  red: ansi:red
  green: ansi:green
  yellow: ansi:yellow
  blue: ansi:blue
  pink: ansi:magenta
  cyan: ansi:cyan

  black: '000000'
  gray: '999999'
  darkgray: '666666'
  darkergray: '333333'

core:
  normal_text: {}
  regular_file: {}
  reset_to_normal: {}

  # Directories
  directory:
    foreground: blue

  sticky:
    foreground: blue
    font-style: bold

  other_writable:
    foreground: blue
    font-style: underline

  sticky_other_writable:
    foreground: blue
    font-style: [bold, underline]

  # Executables
  executable_file:
    foreground: yellow
    font-style: bold

  setuid:
    foreground: yellow
    font-style: [bold, underline]

  setgid:
    foreground: yellow
    font-style: [bold, underline]

  # Symlinks
  symlink:
    foreground: cyan
    font-style: italic

  broken_symlink:
    foreground: red
    font-style: italic

  missing_symlink_target:
    foreground: red
    font-style: bold

  multi_hard_link: {}

  # IPC files
  fifo:
    foreground: pink

  socket:
    foreground: pink
    font-style: bold

  door:
    foreground: pink
    font-style: bold

  # Devices
  block_device:
    foreground: green
    font-style: [bold, underline]

  character_device:
    foreground: green
    font-style: bold

  file_with_capability: {}

text:
  special:
    foreground: yellow
    font-style: bold

  todo:
    foreground: yellow
    font-style: bold

  licenses: {}

  configuration:
    foreground: yellow

  other: {}

markup:
  foreground: yellow

programming:
  source:
    foreground: green

  tooling:
    foreground: green

    continuous-integration:
      foreground: green

media:
  foreground: pink

office:
  foreground: red

archives:
  foreground: cyan
  font-style: underline

executable:
  foreground: red
  font-style: bold

unimportant:
  foreground: darkgray
